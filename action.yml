name: Power BI report validator
description: Compare two versions of a Power BI report (PBIP) and report what changed.
author: m-c-v-k
branding:
  icon: bar-chart-2
  color: yellow

# Credentials are never inputs. Pass them as environment variables on the
# step instead: PBI_TENANT_ID, PBI_CLIENT_ID, PBI_CLIENT_SECRET, and for
# ai: api ANTHROPIC_API_KEY (optionally PBI_VALIDATE_AI_MODEL).
# PBI_VALIDATE_AI=disabled on the step blocks ai: api.
inputs:
  old:
    description: Old PBIP project or .Report folder, relative to the workspace.
    required: true
  new:
    description: New PBIP project or .Report folder, relative to the workspace.
    required: true
  html:
    description: Write a self-contained HTML report to this path.
    default: ""
  json:
    description: Write the full result as JSON to this path.
    default: ""
  markdown:
    description: Write a Markdown summary to this path.
    default: ""
  fail-on:
    description: Fail when a finding has at least this severity (none, info, warning, critical).
    default: none
  fail-on-data-error:
    description: With data, fail when the data of a visual could not be fully validated.
    default: "false"
  comment:
    description: Post the Markdown summary as a pull request comment, updated on later runs (needs pull-requests write).
    default: "false"
  github-token:
    description: Token for the pull request comment.
    default: ${{ github.token }}
  data:
    description: Also compare the numbers against the published datasets (needs PBI_* credentials).
    default: "false"
  old-dataset:
    description: Dataset id of the old version (with data).
    default: ""
  new-dataset:
    description: Dataset id of the new version (with data).
    default: ""
  abs-tol:
    description: Allowed absolute difference (with data).
    default: ""
  rel-tol:
    description: Allowed relative difference (with data).
    default: ""
  show-data-values:
    description: With data, show row keys and values instead of masking them. The job summary and pull request comment then contain row-level data.
    default: "false"
  ai:
    description: Optional AI layer, off or api (needs ANTHROPIC_API_KEY; the key owner pays). api uses the -ai image variant.
    default: "off"
  allow-data-to-llm:
    description: With ai api, allow row-level values in what is sent to the Anthropic API.
    default: "false"
  ai-match:
    description: With ai api, suggest renamed pages, visuals and measures.
    default: "false"
  ai-explain:
    description: With ai api, explain findings in plain language.
    default: "false"
  ai-explain-from:
    description: Lowest severity to explain when ai-explain is enabled (info, warning, critical).
    default: ""

outputs:
  json:
    description: Path of the JSON result (the json input, or a temporary file).
    value: ${{ steps.run.outputs.json }}
  html:
    description: Path of the HTML report, if written.
    value: ${{ steps.run.outputs.html }}
  markdown:
    description: Path of the Markdown summary (the markdown input, or a temporary file).
    value: ${{ steps.run.outputs.markdown }}
  findings:
    description: Number of findings.
    value: ${{ steps.run.outputs.findings }}
  critical:
    description: Number of critical findings.
    value: ${{ steps.run.outputs.critical }}
  warning:
    description: Number of warning findings.
    value: ${{ steps.run.outputs.warning }}
  info:
    description: Number of info findings.
    value: ${{ steps.run.outputs.info }}

runs:
  using: composite
  steps:
    # A version tag uses the published image of that version; any other ref
    # (a branch, a commit SHA or a local `uses: ./`) builds the image from
    # the action's own source, so the code that runs always matches the ref.
    # ai: api uses the variant with the [ai] extra (tag suffix -ai).
    - name: Prepare image
      id: image
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
        ACTION_PATH: ${{ github.action_path }}
        IN_AI: ${{ inputs.ai }}
      run: |
        extras="" suffix=""
        if [[ "${IN_AI,,}" == api ]]; then extras=ai suffix=-ai; fi
        if [[ "$ACTION_REF" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
          image="ghcr.io/m-c-v-k/pbi-report-validator:${BASH_REMATCH[1]}$suffix"
          echo "Using the published image $image"
          docker pull --quiet "$image"
        else
          image="pbi-validate:local$suffix"
          echo "Building the image from source (ref '${ACTION_REF}' is not a version tag)"
          docker build --quiet --build-arg "EXTRAS=$extras" --tag "$image" "$ACTION_PATH"
        fi
        echo "image=$image" >> "$GITHUB_OUTPUT"

    - name: Run pbi-validate diff
      id: run
      shell: bash
      env:
        IMAGE: ${{ steps.image.outputs.image }}
        IN_OLD: ${{ inputs.old }}
        IN_NEW: ${{ inputs.new }}
        IN_HTML: ${{ inputs.html }}
        IN_JSON: ${{ inputs.json }}
        IN_MARKDOWN: ${{ inputs.markdown }}
        IN_FAIL_ON: ${{ inputs.fail-on }}
        IN_FAIL_ON_DATA_ERROR: ${{ inputs.fail-on-data-error }}
        IN_COMMENT: ${{ inputs.comment }}
        GH_TOKEN: ${{ inputs.github-token }}
        IN_DATA: ${{ inputs.data }}
        IN_OLD_DATASET: ${{ inputs.old-dataset }}
        IN_NEW_DATASET: ${{ inputs.new-dataset }}
        IN_ABS_TOL: ${{ inputs.abs-tol }}
        IN_REL_TOL: ${{ inputs.rel-tol }}
        IN_SHOW_DATA_VALUES: ${{ inputs.show-data-values }}
        IN_AI: ${{ inputs.ai }}
        IN_ALLOW_DATA_TO_LLM: ${{ inputs.allow-data-to-llm }}
        IN_AI_MATCH: ${{ inputs.ai-match }}
        IN_AI_EXPLAIN: ${{ inputs.ai-explain }}
        IN_AI_EXPLAIN_FROM: ${{ inputs.ai-explain-from }}
      run: bash "$GITHUB_ACTION_PATH/action/run.sh"
