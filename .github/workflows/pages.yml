name: Pages

# Publish the demo: the HTML report for the synthetic fixtures plus the test
# coverage report and badge, built by CI on every push to main. PRs that
# change the demo only build it.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
    paths:
      - docs/demo/**
      - pyproject.toml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Generate reports from the fixtures
        run: |
          mkdir -p site
          cp docs/demo/index.html site/
          uv run pbi-validate diff tests/fixtures/sales_v1 tests/fixtures/sales_v2 \
            --html site/report.html --json site/diff.json --markdown site/diff.md

      - name: Coverage report and badge
        run: |
          uv run pytest -q --cov --cov-report=html:site/coverage
          pct=$(uv run coverage report --format=total)
          if [ "$pct" -ge 95 ]; then color=brightgreen
          elif [ "$pct" -ge 85 ]; then color=yellow
          else color=red; fi
          printf '{"schemaVersion": 1, "label": "coverage", "message": "%s%%", "color": "%s"}\n' \
            "$pct" "$color" > site/coverage-badge.json
          rm -f site/coverage/.gitignore

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
