name: Release

# On a version tag: build the wheel and sdist and attach them to the
# GitHub release. On PRs that touch packaging: build only, as a check.
on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/release.yml

permissions:
  contents: read

jobs:
  package:
    name: Build package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Check tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version $version"
            exit 1
          fi

      - name: Build wheel and sdist
        run: uv build

      - name: Smoke test the wheel
        run: uvx --from dist/*.whl pbi-validate diff tests/fixtures/sales_v1 tests/fixtures/sales_v2

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes "Draft created by the release workflow."
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
