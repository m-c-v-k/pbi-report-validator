name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests, lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Tests with coverage
        # `shell: bash` adds -o pipefail, so a test failure or a coverage
        # drop fails the step even though the output is piped into tee.
        shell: bash
        run: |
          uv run pytest -v --cov --cov-report=term --cov-report=html \
            --junitxml=test-results.xml | tee pytest.log

      - name: Test report
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Tests"
            echo
            echo "\`$(tail -n 1 pytest.log | tr -d '=' | xargs)\`"
            echo
            echo "## Coverage"
            echo
            uv run coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage and test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            htmlcov/
            test-results.xml
          retention-days: 30

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy src

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
