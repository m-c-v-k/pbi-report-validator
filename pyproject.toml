[project]
name = "pbi-report-validator"
version = "0.0.1"
description = "Compare two versions of a Power BI report (PBIP) and report what changed."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marcus Klingborg" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Environment :: Console",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.13.5",
    "typer>=0.27.2",
]

[project.scripts]
pbi-validate = "pbi_report_validator.cli.main:app"

[project.urls]
Repository = "https://github.com/m-c-v-k/pbi-report-validator"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pbi_report_validator"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "D", "RUF", "PTH", "T20"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"src/pbi_report_validator/cli/**" = ["T20"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["pbi_report_validator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
