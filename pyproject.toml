[project]
name = "pbi-report-validator"
version = "0.1.0"
description = "Compare two versions of a Power BI report (PBIP) and report what changed."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Marcus Klingborg" }]
requires-python = ">=3.12"
keywords = ["power-bi", "pbip", "pbir", "tmdl", "report", "diff", "validation", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "msal>=1.39.0",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "typer>=0.27.2",
]

[project.scripts]
pbi-validate = "pbi_report_validator.cli.main:app"

[project.urls]
Homepage = "https://github.com/m-c-v-k/pbi-report-validator"
Repository = "https://github.com/m-c-v-k/pbi-report-validator"
Issues = "https://github.com/m-c-v-k/pbi-report-validator/issues"
Changelog = "https://github.com/m-c-v-k/pbi-report-validator/releases"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pbi_report_validator"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "D", "RUF", "PTH", "T20"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"src/pbi_report_validator/cli/**" = ["T20"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["pbi_report_validator"]

# msal ships without type information (no py.typed). It is only used behind
# the typed MsalTokenProvider wrapper in integrations/powerbi.py.
[[tool.mypy.overrides]]
module = ["msal", "msal.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
